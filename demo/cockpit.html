<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teamleiter-Cockpit (Demo)</title>
<style>
/* Demo-Stylesheet (Beispieldaten) */
:root {
  --bg: #f3f4f1;
  --ink: #14213a;
  --ink-2: #33415c;
  --muted: #5a6478;
  --line: #dfe2db;
  --line-2: #cfd4cb;
  --line-soft: #ebede8;
  --card: #ffffff;
  --navy: #14213a;
  --navy-2: #24345a;
  --navy-3: #2a3b62;
  --on-navy: #d6dceb;
  --green: #7fd8ac;
  --tab-bg: #e4e7e1;
  --tab-ink: #4a5468;
  --soft: #f3f4f1;
  --link: #14325c;
  --open-bg: #f6ead8;
  --open-ink: #7a4a0c;
  --done-bg: #dff1e7;
  --done-ink: #155c3c;
  --done-line: #b9dcc8;
  --done-soft: #eef8f2;
  --warn-bg: #fbefdc;
  --warn-line: #ecd2a8;
  --warn-ink: #5c3606;
  --warn-ink-2: #6b4a1a;
  --bad-bg: #f8e1dc;
  --bad-ink: #8a2414;
  --radius: 16px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
a { color: var(--link); }
a:hover { color: #0b1f3d; }
button, input, select, textarea { font-family: inherit; font-size: 16px; color: var(--ink); }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }

/* ---------- Layout */
.page { min-height: 100vh; padding: 24px 16px 64px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.wrap.narrow { max-width: 480px; gap: 18px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.between { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.baseline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }

/* ---------- Kopf und Navigation */
.app-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.title { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
.title-sm { font-size: 22px; font-weight: 700; }
.h1 { font-size: 22px; font-weight: 700; }
.h2 { font-size: 17px; font-weight: 700; }
.h3 { font-size: 15px; font-weight: 700; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; background: var(--tab-bg); padding: 4px; border-radius: 12px; }
.nav a { display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 9px; color: var(--tab-ink); font-size: 15px; font-weight: 500; text-decoration: none; }
.nav a[aria-current="page"] { background: #fff; color: var(--ink); font-weight: 600; }
.head-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.foot { display: flex; justify-content: center; padding-top: 8px; }

/* ---------- Text */
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.strong { font-weight: 700; }
.err { color: var(--bad-ink); }

/* ---------- Knöpfe */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; color: var(--ink); font-size: 15px; font-weight: 600; text-decoration: none; }
.btn:hover { background: #f7f8f5; color: var(--ink); }
.btn-primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn-primary:hover { background: #0e1830; color: #fff; }
.btn-danger { background: #fff; border-color: #d9a39b; color: var(--bad-ink); }
.btn-warn { background: var(--warn-ink); border-color: var(--warn-ink); color: #fff; }
.btn-warn:hover { background: #4a2c05; color: #fff; }
.btn-sm { min-height: 44px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn-block { width: 100%; min-height: 48px; border-radius: 12px; font-size: 16px; }
.btn-link { background: none; border: none; color: var(--link); text-decoration: underline; min-height: 44px; padding: 0 8px; font-size: 14px; font-weight: 600; }
.btn:disabled { opacity: 0.55; }
.btn-done { background: var(--done-soft); border-color: var(--done-line); color: var(--done-ink); }
.btn-done:hover { background: var(--done-soft); color: var(--done-ink); }
.btn-ghost-dashed { border-style: dashed; border-color: #c3c8bf; background: #f7f8f5; color: var(--muted); font-weight: 500; }

/* ---------- Karten */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card-dark { background: var(--navy); border-color: var(--navy); color: #fff; padding: 20px; }
.card-dark .on-navy { color: var(--on-navy); }
.card-warn { background: var(--warn-bg); border-color: var(--warn-line); }
.card-warn .h2 { color: var(--warn-ink); }
.card-warn .sub { color: var(--warn-ink-2); font-size: 14px; }
.card-tight { gap: 4px; }
.stat { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 13px; color: var(--muted); }
.big { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big-44 { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.money { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.inner { background: var(--soft); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.banner { background: var(--done-soft); border: 1px solid var(--done-line); color: var(--done-ink); border-radius: 14px; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.banner.info { background: #e8eef9; border-color: #c3d1ea; color: #1d3a6e; }
.banner.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.banner.bad { background: var(--bad-bg); border-color: #e3b2a9; color: var(--bad-ink); }

/* ---------- Fortschritt */
.bar { height: 12px; background: var(--navy-3); border-radius: 999px; overflow: hidden; }
.bar.thin { height: 10px; }
.bar > span { display: block; height: 100%; background: var(--green); border-radius: 999px; }

/* ---------- Pills */
.pill { display: inline-block; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
.pill-open { background: var(--open-bg); color: var(--open-ink); }
.pill-done { background: var(--done-bg); color: var(--done-ink); }
.pill-warn { background: var(--warn-bg); color: var(--warn-ink); }
.pill-bad { background: var(--bad-bg); color: var(--bad-ink); }
.pill-neutral { background: #e7eaf0; color: #33415c; }
.pill-mini { font-size: 12px; padding: 2px 8px; margin-left: 6px; }

/* ---------- Umschalter */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; }
.seg button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; font-size: 15px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
.seg-dark { display: flex; gap: 4px; background: var(--navy-2); padding: 4px; border-radius: 10px; }
.seg-dark button { min-height: 40px; padding: 0 14px; border-radius: 8px; border: none; background: transparent; color: var(--on-navy); font-size: 15px; font-weight: 500; }
.seg-dark button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: #fff; font-size: 14px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 600; }
.chip .n { opacity: 0.75; margin-left: 4px; font-variant-numeric: tabular-nums; }

/* ---------- Zähler */
.counter { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--soft); border-radius: 12px; padding: 8px 8px 8px 14px; }
.counter .lab { font-size: 16px; font-weight: 600; }
.counter .hint { font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.step-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: #fff; font-size: 22px; line-height: 1; padding: 0; }
.step-btn.plus { background: var(--navy); border-color: var(--navy); color: #fff; }
.step-val { min-width: 32px; text-align: center; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

/* ---------- Formulare */
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.field input, .field select, .field textarea, .input { height: 44px; border: 1px solid var(--line-2); border-radius: 10px; padding: 0 12px; background: #fff; color: var(--ink); font-size: 16px; font-weight: 400; width: 100%; min-width: 0; }
.field textarea, textarea.mono-area { height: auto; min-height: 120px; padding: 10px 12px; width: 100%; border: 1px solid var(--line-2); border-radius: 10px; }
textarea.mono-area { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
.field-row { display: flex; flex-wrap: wrap; gap: 10px; }
.field-row > .field { flex: 1 1 150px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; font-weight: 500; color: var(--ink); }
.check input { width: 22px; height: 22px; flex: none; accent-color: var(--navy); }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.form-grid .full { grid-column: 1 / -1; }

/* ---------- Aufklappbare Bereiche */
details.card { padding: 14px 18px; gap: 0; }
details > summary { font-size: 16px; font-weight: 700; cursor: pointer; padding: 6px 0; min-height: 44px; display: flex; align-items: center; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: '+'; margin-left: auto; font-size: 22px; font-weight: 400; color: var(--muted); }
details[open] > summary::after { content: '–'; }
details > .details-body { display: flex; flex-direction: column; gap: 14px; padding-top: 10px; }
.mini-toggle { background: none; border: none; color: var(--link); text-decoration: underline; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0; text-align: left; }

/* ---------- Listen */
.list { display: flex; flex-direction: column; }
.row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line-soft); }
.row:first-child { border-top: none; }
.row .main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 140px; }
.row .name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.row .meta { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kv { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 3px 0; }
.kv.total { border-top: 1px solid var(--line-soft); margin-top: 4px; padding-top: 8px; font-weight: 700; font-size: 16px; }
.menu-item { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line-soft); }
.menu-item:first-child { border-top: none; }

/* ---------- Mitarbeiterkarte (Heute) */
.person { gap: 14px; }
.person .name { font-size: 18px; font-weight: 700; }
.person .sub { font-size: 14px; color: var(--muted); }
.save-state { font-size: 13px; color: var(--muted); }
.save-state[data-state="offline"] { color: var(--open-ink); }

/* ---------- Diagramm */
.chart { display: flex; align-items: flex-end; gap: 3px; height: 190px; }
.chart-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%; }
.chart-bar { width: 100%; max-width: 28px; border-radius: 6px 6px 2px 2px; background: var(--navy); min-height: 3px; }
.chart-bar.empty { background: #d9ddd5; }
.chart-val { font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chart-day { font-size: 12px; color: var(--muted); }

/* ---------- Tabelle */
.table-box { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line-soft); }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
thead th { position: sticky; top: 0; background: #f3f4f1; font-size: 12px; color: var(--muted); z-index: 1; }
thead th:first-child { z-index: 2; background: #f3f4f1; }

/* ---------- Dialog / Bottom-Sheet */
dialog.sheet { border: none; padding: 0; background: transparent; width: 100%; max-width: 560px; max-height: 92vh; margin: auto auto 0; color: var(--ink); }
dialog.sheet::backdrop { background: rgba(20, 33, 58, 0.5); }
.sheet-body { background: #fff; border-radius: 20px 20px 0 0; padding: 20px 18px 28px; display: flex; flex-direction: column; gap: 14px; max-height: 92vh; overflow: auto; }
.sheet-text { font-size: 16px; }
@media (min-width: 600px) {
  dialog.sheet { margin: auto; }
  .sheet-body { border-radius: 20px; }
}

/* ---------- Hinweis-Einblendung */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 100; max-width: calc(100vw - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast[data-kind="error"] { background: var(--bad-ink); }

/* ---------- Schmale Bildschirme */
@media (max-width: 420px) {
  .big, .big-44 { font-size: 28px; }
  .nav a { padding: 0 12px; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .toast { transition: none; }
}

/* ---------- Gebiete-Zeilen */
.row.compact .name { font-size: 16px; font-weight: 600; }
.row.compact { padding: 10px 0; }
.legal { font-size: 13px; color: var(--muted); }
progress { width: 100%; height: 12px; accent-color: var(--navy); }
.install-hint { position: relative; }
.page { padding-top: max(24px, calc(env(safe-area-inset-top) + 12px)); padding-bottom: max(64px, calc(env(safe-area-inset-bottom) + 40px)); }

/* ---------- Hilfsklassen */
.stack.tight { gap: 8px; }
.stack.roomy { gap: 20px; }
.stack.hair { gap: 2px; }
.stack.gap-top { margin-top: 6px; }
.w-date { width: 170px; }
.btn-row.center { align-items: center; }
.details-body.flush { gap: 0; }
.lead { font-size: 15px; font-weight: 500; }
.mini-toggle.on-dark { color: #fff; }
.mt { margin-top: 8px; }
.tabs-inline { display: flex; align-items: center; gap: 6px; }
.grow2 { flex: 2 1 220px !important; }
.grow1 { flex: 1 1 160px !important; }
.card-row { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.check.indent { padding-left: 28px; }
.row .name.sm { font-size: 15px; }
.meta.selectable { user-select: all; -webkit-user-select: all; }
.on-navy.t14 { font-size: 14px; }
.nowrap { flex-wrap: nowrap !important; }
.accent-green { color: var(--green); }
.sum-row { border-top: 1px solid var(--line-soft); padding-top: 12px; }
.month-name { min-width: 110px; text-align: center; }

/* ---------- Onboarding (o.html) */
.ob-nav { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.ob-nav button { height: 44px; border: none; background: none; border-radius: 9px; color: var(--tab-ink); font-size: 15px; font-weight: 500; padding: 0 4px; }
.ob-nav button[aria-current="page"] { background: #fff; color: var(--ink); font-weight: 600; }
details.ob-step { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
details.ob-step > summary { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 60px; list-style: none; }
details.ob-step > summary::after { content: none; }
.ob-num { flex: 0 0 34px; height: 34px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; }
.ob-pdf { font-size: 12px; font-weight: 800; color: var(--muted); }
.ob-step.done .ob-num { background: var(--done-bg); border-color: var(--done-line); color: var(--done-ink); }
.ob-nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ob-nm b { font-size: 17px; }
.ob-nm small { font-size: 13px; font-weight: 400; color: var(--muted); }
.ob-chev { flex: none; color: var(--muted); transition: transform 0.2s; }
details[open] > summary .ob-chev { transform: rotate(90deg); }
.ob-body { padding: 0 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; font-weight: 400; }
.ob-body .say { background: var(--soft); border-radius: 12px; padding: 12px 14px; }
.ob-body .say p { margin: 0; }
.ob-body .say.quote p { font-weight: 600; }
.ob-body .label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
.ob-body .note { border-left: 3px solid; border-radius: 0 10px 10px 0; padding: 8px 12px; font-size: 15px; }
.ob-body .note.bad { border-color: var(--bad-ink); background: var(--bad-bg); }
.ob-body .note.warn { border-color: var(--open-ink); background: var(--warn-bg); }
.ob-body .note.info { border-color: #1d3a6e; background: #e8eef9; }
.ob-body ol.l, .ob-body ul.l { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
.ob-body .row { border: none; padding: 0; }
.ob-body .sub { color: var(--muted); font-size: 14px; }
.ob-q { font-size: 20px; font-weight: 700; line-height: 1.3; }
.ob-opt { text-align: left; min-height: 48px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: #fff; font-size: 16px; font-weight: 600; }
.ob-opt.wrong { border-color: var(--bad-ink); background: var(--bad-bg); color: var(--bad-ink); animation: ob-shake 0.3s; }
.ob-picked { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 12px; background: var(--done-soft); color: var(--done-ink); font-weight: 600; }
.ob-picked .ob-num { background: transparent; border-color: var(--done-line); }
.card.ob-card { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--ink); }
.ob-ver { text-align: center; }
@keyframes ob-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (max-width: 420px) { .ob-nav button { font-size: 14px; } }
@media (prefers-reduced-motion: reduce) { .ob-opt.wrong { animation: none; } .ob-chev { transition: none; } }

/* ---------- Aufklappbare Zeilen (Gebiete, Team) */
details.g-fold { border-top: 1px solid var(--line-soft); }
details.g-fold:first-child { border-top: none; }
details.g-fold > summary { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 0; list-style: none; font-weight: 600; }
details.g-fold > summary::after { content: '\203A'; margin-left: 0; font-size: 22px; color: var(--muted); transition: transform 0.2s; }
details.g-fold[open] > summary::after { content: '\203A'; transform: rotate(90deg); }
.g-name { flex: 1; min-width: 0; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.g-pills { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.g-pills .pill-mini { margin-left: 0; }
.g-body { display: flex; flex-direction: column; gap: 8px; padding: 0 0 14px; }
.t-nums { gap: 20px; }
.g-stats { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 4px; }
.g-stats b { color: var(--ink); }
@media (prefers-reduced-motion: reduce) { details.g-fold > summary::after { transition: none; } }
.ob-body .ob-img { display: block; margin: 8px 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
.ob-body .ob-img img { display: block; width: 100%; height: auto; }

function onbPill(e) {

viewEl.addEventListener('click', function (ev) {
