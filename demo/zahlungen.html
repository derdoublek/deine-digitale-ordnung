<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zahlungen – Demo</title>
<meta name="theme-color" content="#162036">
<style>
:root{
  --bg:#f3f3f1;--card:#fff;--line:#e3e4df;--ink:#162036;--mute:#5d6779;
  --shadow:0 1px 2px rgba(22,32,54,.04);
  --tabs:#e6e7e2;--btnline:#cfd2d8;--primary:#162036;--primary-ink:#fff;
  --ok:#1f7a4d;--warn:#a86b00;--err:#c0262d;--pp:#1f4fa8;--sp:#c0262d;--grey:#7b8494;
  --kpi:#162036;--kpi-ink:#fff;--kpi-mute:#b3bccd;--warnbg:#fbf4e4;--chip:#eceee9;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f141c;--card:#171e2a;--line:#273041;--ink:#eef1f6;--mute:#9aa5b8;
    --shadow:none;--tabs:#1d2635;--btnline:#36415a;--primary:#eef1f6;--primary-ink:#0f141c;
    --ok:#4cc58a;--warn:#e0a63a;--err:#ff6b72;--pp:#6c9bff;--sp:#ff7b80;--grey:#8a95a8;
    --kpi:#1f2a3d;--kpi-ink:#fff;--kpi-mute:#b3bccd;--warnbg:#2a2415;--chip:#212b3c;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4;overflow-x:hidden;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-weight:700;letter-spacing:-.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.head .t{cursor:pointer;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--mute);font-weight:600;text-transform:uppercase}
.head h1{font-size:22px;line-height:1.15}
.status{font-size:12px;color:var(--mute);min-height:16px}
.gear{width:44px;height:44px;border-radius:12px;border:1px solid var(--btnline);background:var(--card);font-size:20px;cursor:pointer;flex:none}
.tabs{display:flex;background:var(--tabs);border-radius:14px;padding:4px;gap:2px;margin-bottom:16px}
.tabs button{flex:1;min-height:44px;border:0;background:transparent;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--mute);cursor:pointer;padding:0 4px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(22,32,54,.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:12px}
.pad{padding:14px 16px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--btnline);background:var(--card);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.small{min-height:44px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.5}
.kpi{background:var(--kpi);color:var(--kpi-ink);border-radius:16px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-bottom:12px}
.kpi>div{min-width:0}
.kpi .l{font-size:13px;color:var(--kpi-mute)}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--kpi-mute);margin-top:2px}
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthbar .m{font-weight:700;font-size:18px;text-align:center;flex:1}
.arrow{width:44px;height:44px;border-radius:12px;border:1px solid var(--btnline);background:var(--card);font-size:22px;cursor:pointer}
.sec{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:20px 4px 8px}
details.card>summary{list-style:none;cursor:pointer;padding:14px 16px;min-height:44px;display:flex;gap:10px;align-items:center;justify-content:space-between}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary .main{min-width:0;flex:1}
details.card>summary .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.card>summary .sub{font-size:13px;color:var(--mute)}
details.card>summary .sub .pd{color:var(--ok);font-weight:600;white-space:nowrap}
details.card>summary .sub .nw{white-space:nowrap}
details.card>summary .owe{font-size:13.5px;font-weight:700;color:var(--warn);white-space:nowrap}
details.card>summary .pbar{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;max-width:220px}
details.card>summary .pbar>span{display:block;height:100%;background:var(--ok);border-radius:3px}
details.card>summary .kv{gap:0!important}
details.card>summary .kv .kl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-top:2px}
details.card>summary .kv .pv{font-weight:700;font-size:17px;color:var(--warn)}
details.card>summary .kv .pv.done{color:var(--ok)}
details.card>summary .right{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
details.card>summary .amt{font-weight:700;white-space:nowrap}
details.card .body{border-top:1px solid var(--line);padding:6px 16px 14px}
details.card[open]>summary .chev{transform:rotate(90deg)}
.chev{display:inline-block;transition:transform .15s;color:var(--mute);margin-right:2px}
.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.grey{color:var(--grey)}.pill.err{color:var(--err)}.pill.pp{color:var(--pp)}.pill.sp{color:var(--sp)}
.prow{display:flex;align-items:center;gap:10px;justify-content:space-between;min-height:48px;padding:6px 0;border-bottom:1px solid var(--line)}
.prow:last-of-type{border-bottom:0}
.prow .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.prow .d{font-size:13px;color:var(--mute)}
.prow.tap{cursor:pointer}
.note{font-size:13px;color:var(--warn);margin:4px 0}
.mute{color:var(--mute)}
.warnbox{background:var(--warnbg);border:1px solid var(--warn);border-radius:16px;margin-bottom:12px}
.warnbox>summary{color:var(--warn);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:20}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.bar .btn{flex:1;min-height:48px;box-shadow:0 2px 8px rgba(22,32,54,.18)}
.ver{text-align:center;font-size:12px;color:var(--mute);margin:20px 0 4px}
.upd{position:sticky;top:0;z-index:30;background:var(--primary);color:var(--primary-ink);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600;font-size:14px}
.upd button{min-height:36px;border-radius:10px;border:0;padding:0 12px;font-weight:700;cursor:pointer}
.errbar{background:var(--err);color:#fff;padding:10px 16px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.errbar button{background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer;min-width:44px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--btnline);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;flex:none}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.seg{display:flex;gap:8px}
.seg button{flex:1;min-height:52px;border-radius:12px;border:1.5px solid var(--btnline);background:var(--card);font-weight:700;font-size:16px;cursor:pointer}
.seg button.on.pp{border-color:var(--pp);color:var(--pp);background:color-mix(in srgb,var(--pp) 10%,var(--card))}
.seg button.on.sp{border-color:var(--sp);color:var(--sp);background:color-mix(in srgb,var(--sp) 10%,var(--card))}
.seg button.on.plain{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.search,.fld{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--btnline);background:var(--card);padding:0 14px;font-size:16px}
.search{margin-bottom:10px}
.sums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.sums div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-width:0}
.sums .l{font-size:12px;color:var(--mute)}
.sums .v{font-weight:800;font-size:15px;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:24px 8px}
.chart{width:100%;height:auto;display:block}
.chart rect.b{fill:var(--btnline);cursor:pointer}
.chart rect.b.cur{fill:var(--mute)}
.chart rect.b.sel{fill:var(--primary)}
.chart text{fill:var(--mute);font-size:12px;text-anchor:middle;font-family:inherit}
/* Sheet */
.ov{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet h2{font-size:22px;margin-bottom:12px}
.sheet label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 4px}
.sheet .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sheet .row .fld{min-width:0}
.sheet .row .share{width:120px;flex:none}
.sheet .x{width:44px;height:44px;flex:none;border:1px solid var(--btnline);background:var(--card);border-radius:12px;cursor:pointer;font-size:18px}
.sheet .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheet .actions .btn{flex:1;min-width:120px}
.sheet .err{color:var(--err);font-weight:600;font-size:14px;margin-top:10px;min-height:0}
.sug{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:48px;padding:8px 12px;margin-bottom:6px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.sug.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.sug .a{min-width:0}.sug .a b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .a span{font-size:12.5px;color:var(--mute)}
.sug .r{font-weight:700;white-space:nowrap}
textarea.fld{padding:10px 14px;min-height:110px;font-size:14px}
[hidden]{display:none!important}
textarea.fld.note1{min-height:48px;font-size:16px;resize:none;overflow:hidden;padding-top:12px}
select.fld{appearance:auto}
.catp{display:inline-block;background:var(--chip);color:var(--mute);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;margin-left:6px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.seg.sm button{min-height:44px;font-size:14px}
.sug.hit{border-color:var(--ok)}
.pnote{font-size:12.5px;color:var(--mute);font-style:italic;overflow-wrap:anywhere}
.selcard{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1.5px solid var(--primary);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.selcard .t{min-width:0;font-size:14px;overflow-wrap:anywhere}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.grp>summary{list-style:none;cursor:pointer;min-height:44px;padding:10px 12px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}
details.grp[open]>summary .chev{transform:rotate(90deg)}
details.grp .gb{padding:2px 8px 4px}
select.pcat{margin-bottom:10px}
.sbox{position:relative;margin-bottom:12px}
.sbox .search{margin-bottom:0;padding-right:48px}
#hq::-webkit-search-cancel-button{display:none}
.sx{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;font-size:18px;color:var(--mute);cursor:pointer}
.prow.hl{background:color-mix(in srgb,var(--warn) 10%,var(--card));margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:10px}
.btn.ghost{background:transparent;color:var(--mute);text-decoration:none}
.undo{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;z-index:70;background:var(--primary);color:var(--primary-ink);border-radius:14px;padding:6px 8px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;box-shadow:0 4px 16px rgba(22,32,54,.3)}
.undo[hidden]{display:none}
.undo button{min-height:44px;border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;cursor:pointer;padding:0 12px}
.ord{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;overflow:hidden}
.ordh{width:100%;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:52px;padding:8px 12px;background:transparent;border:0;cursor:pointer}
.ordh .a{min-width:0}.ordh .a b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ordh .a span{font-size:12.5px;color:var(--mute)}
.ordh .r{font-weight:700;white-space:nowrap}
.ordb{padding:0 8px 8px}
.ordb .btn.newp{width:100%;white-space:normal;text-align:center;height:auto;padding:8px 12px}
.ordb .btn.newp.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.prow .btn.small{padding:0 10px}
.chk{width:44px;height:44px;flex:none;border-radius:50%;border:2px solid var(--btnline);background:var(--card);color:transparent;font-size:20px;font-weight:800;cursor:pointer;padding:0}
.chk.on{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.qrow{display:flex;gap:6px;align-items:center;padding:0 0 10px;flex-basis:100%;min-width:0}
.qrow .btn{flex:1;min-width:0;padding:0 8px}
.qrow .x{width:44px;height:44px;flex:none;border:1px solid var(--btnline);background:var(--card);border-radius:12px;cursor:pointer;font-size:18px}
.pfbar{display:flex;align-items:center;gap:8px;margin:4px 0 6px;flex-wrap:wrap}
.pfbar .seg{flex:1;min-width:200px}.pfbar .seg button{min-height:44px;font-size:14px}
.pfbar .cnt{font-size:13px;color:var(--mute)}
.nsug{margin:-4px 0 8px;display:flex;flex-direction:column;gap:4px}
.nsug button{min-height:44px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;font-weight:600;cursor:pointer}
.sheet.wiz{display:flex;flex-direction:column;padding:0;overflow:hidden}
.wbody{overflow-y:auto;padding:16px 16px 8px;flex:1;min-height:0;overscroll-behavior:contain}
.wfoot{border-top:1px solid var(--line);padding:8px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg)}
.wfoot .actions{margin-top:8px}
.wfoot .btn{white-space:nowrap;padding:0 10px}
.wsumtxt{font-size:13.5px;font-weight:600;text-align:center;color:var(--ink)}
.wst{font-size:13px;font-weight:600;color:var(--mute);margin-left:6px}
.whead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 4px;font-weight:600;min-height:44px}
.sw{width:72px;height:44px;border-radius:999px;border:0;background:var(--btnline);position:relative;cursor:pointer;padding:0;flex:none}
.sw i{position:absolute;top:4px;left:4px;width:36px;height:36px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)}.sw.on i{left:32px}
.linkbtn{background:none;border:0;color:var(--pp);font-weight:700;min-height:44px;padding:0;cursor:pointer;font-size:15px;margin-top:6px;display:block}
.draftbar{background:var(--warnbg);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:600;font-size:14px}
.draftbar .actions{margin-top:8px}
.herr{color:var(--err);font-weight:600;font-size:14px}
#w-hint{min-height:0;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wp{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wp .t{flex:1;min-width:0}.wp .t b{display:block;overflow:hidden;text-overflow:ellipsis}.wp .t span{font-size:13px;color:var(--mute)}
.wp.edit{cursor:default}.wp .row{margin:0}
.wp.ask{flex-wrap:wrap;cursor:default}
.demobar{background:var(--tabs);color:var(--mute);text-align:center;font-size:12px;font-weight:600;letter-spacing:.02em;padding:6px 12px;border-bottom:1px solid var(--line)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:608px;margin:0 auto;z-index:70;background:var(--primary);color:var(--primary-ink);border-radius:14px;padding:10px 6px 10px 16px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;box-shadow:0 4px 16px rgba(22,32,54,.3)}
.toast button{min-height:36px;min-width:36px;border:0;background:transparent;color:inherit;font-size:18px;cursor:pointer;flex:none}
.toast .q{display:block;font-weight:500;margin-top:4px;opacity:.9}
.login{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}

/* ===== Animationen ===== */
button,.btn,.chk,.sug,.ord,.x,[data-act]{-webkit-tap-highlight-color:transparent}
button,.btn{position:relative;overflow:hidden;transition:transform .14s cubic-bezier(.3,.7,.4,1.4),box-shadow .2s,background-color .2s,border-color .2s,color .2s}
button:active,.btn:active{transform:scale(.95)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:currentColor;opacity:.22;transform:scale(0);animation:rip .55s ease-out forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn.busy{color:transparent!important;pointer-events:none}
.btn.busy::after{content:"";position:absolute;width:20px;height:20px;left:50%;top:50%;margin:-10px 0 0 -10px;border-radius:50%;border:2.5px solid var(--primary-ink);border-right-color:transparent;animation:spin .7s linear infinite}
.btn:not(.primary).busy::after{border-color:var(--ink);border-right-color:transparent}
.btn.okd{color:transparent!important;pointer-events:none;background:var(--ok)!important;border-color:var(--ok)!important}
.btn.okd::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;animation:pop .35s cubic-bezier(.3,.7,.4,1.6)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
#ov:not([hidden]){animation:fadein .2s ease-out}
#ov:not([hidden]) .sheet{animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
#ov.closing{animation:fadeout .2s ease-in forwards;pointer-events:none}
#ov.closing .sheet{animation:slidedown .2s ease-in forwards}
@keyframes fadein{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes slideup{from{transform:translateY(40px);opacity:.4}}
@keyframes slidedown{to{transform:translateY(60px)}}
.chk.on{animation:pop .3s cubic-bezier(.3,.7,.4,1.6)}
details>summary .chev{transition:transform .2s}
.wp.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{background:color-mix(in srgb,var(--ok) 22%,transparent);transform:translateY(-6px)}25%{transform:none}100%{background:transparent}}
#w-sum.bump{animation:bump .5s cubic-bezier(.3,.7,.4,1.6)}
@keyframes bump{40%{transform:scale(1.06);color:var(--ok)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="demobar">Demo mit Beispieldaten</div>
<div id="top"></div>
<div id="app"></div>
<div class="undo" id="undo" hidden></div>
<div class="toast" id="toast" hidden></div>
<div class="bar" id="bar" hidden><div class="in">
  <button class="btn primary" data-act="new-order">+ Bestellung</button>
  <button class="btn primary" data-act="new-pay">+ Zahlung</button>
</div></div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
'use strict';
var VERSION='1.4.1';
var NAMES={'demo':'Anna'};
var LEGACY_CUTOFF='2026-10-01';

/* ---------- Helpers ---------- */
var eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
function money(c){return eur.format((c||0)/100)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function todayStr(){return '2026-10-25'}
function dLong(s){if(!s)return '';var p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function dShort(s){if(!s)return '';var p=s.split('-');return p[2]+'.'+p[1]+'.'}
function monthOf(s){return (s||'').slice(0,7)}
function addMonth(ym,n){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+'-'+pad(m+1)}
function monthLabel(ym){return new Date(+ym.slice(0,4),+ym.slice(5,7)-1,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})}
function monthName(ym){return new Date(+ym.slice(0,4),+ym.slice(5,7)-1,1).toLocaleDateString('de-DE',{month:'long'})}
function parseCents(str){
  var s=String(str==null?'':str).replace(/[€\s ]/g,'');
  if(!s)return null;
  if(s.indexOf(',')>=0){s=s.replace(/\./g,'').replace(',','.')}
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
  if(!/^\d+(\.\d{1,2})?$/.test(s))return null;
  return Math.round(parseFloat(s)*100);
}
function centsToInput(c){return (c/100).toFixed(2).replace('.',',')}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4)}
function rate(cents){return cents>=100000?0.30:0.25}
function commission(cents){return Math.round(cents*rate(cents))}
function tsMs(t){if(!t)return 0;if(t.toMillis)return t.toMillis();if(t instanceof Date)return t.getTime();if(typeof t==='number')return t;return 0}
function cmpVer(a,b){var x=a.split('.').map(Number),y=b.split('.').map(Number);for(var i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0)}return 0}
function $(s,r){return (r||document).querySelector(s)}
function norm(s){return String(s==null?'':s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function snapDoc(x){var c={};for(var k in x)if(k!=='id')c[k]=x[k];return c}

/* ---------- State ---------- */
var auth,db,user=null,allowed=false,FV;
var orders=[],payments=[],cats=[];
var loaded={orders:false,payments:false,categories:false};
var migrated=false;
var undoFn=null,undoT=null;
var pfilter={},quick=null;
var unsubs=[];
var thisMonth=todayStr().slice(0,7);
var S={tab:'home',month:thisMonth,year:+thisMonth.slice(0,4),umMode:'month',selMonth:null,filter:'all',catFilter:'all',payCat:'all',q:'',hq:'',openMap:{},unOpen:false,errMsg:'',newVer:false,online:navigator.onLine!==false,pending:false};

function by(){return 'demo'}
function who(email){return NAMES[email]||(email||'').split('@')[0]}

/* ---------- Derived data ---------- */
var D={};
function pGoods(p){return p.goodsCents!=null?p.goodsCents:(p.shareCents||0)}
function pShip(p){return p.goodsCents!=null?(p.shipCents||0):0}
function goodsSum(o){return (o.people||[]).reduce(function(a,p){return a+pGoods(p)},0)}
function toCollect(o){return (o.totalCents||0)+(o.people||[]).reduce(function(a,p){return a+pShip(p)},0)}
function gapCents(o){return (o.people||[]).length?(o.totalCents||0)-goodsSum(o):0}
function derive(){
  var pm={};
  payments.forEach(function(p){if(p.orderId&&p.personId){var k=p.orderId+'|'+p.personId;(pm[k]=pm[k]||[]).push(p)}});
  D.pm=pm;
  D.info={};
  orders.forEach(function(o){D.info[o.id]=orderInfo(o)});
}
function orderInfo(o){
  var ppl=o.people||[];
  var shareSum=ppl.reduce(function(a,p){return a+(p.shareCents||0)},0);
  if(!ppl.length)return {state:'none',n:0,paid:0,rows:[],shareSum:0};
  var rows=ppl.map(function(p){
    var pays=(D.pm&&D.pm[o.id+'|'+p.id])||[];
    return {p:p,pays:pays,paid:pays.length>0,sum:pays.reduce(function(a,b){return a+b.cents},0)};
  });
  var paid=rows.filter(function(r){return r.paid}).length;
  return {state:paid===ppl.length&&gapCents(o)<=0?'paid':'open',n:ppl.length,paid:paid,rows:rows,shareSum:shareSum};
}
function monthRevenue(ym){return orders.reduce(function(a,o){return monthOf(o.date)===ym?a+(o.totalCents||0):a},0)}
function openTotal(){
  var t=0;
  orders.forEach(function(o){
    if(o.legacy)return;
    var i=D.info[o.id];
    if(!i.n){t+=o.totalCents||0;return}
    i.rows.forEach(function(r){if(!r.paid)t+=r.p.shareCents||0});
    t+=Math.max(0,gapCents(o));
  });
  return t;
}
function ordPaidSum(o){return D.info[o.id].rows.reduce(function(a,r){return r.paid?a+r.sum:a},0)}
function unassigned(){return payments.filter(function(p){return !p.orderId||!p.personId}).sort(function(a,b){return a.date<b.date?1:-1})}
function openPersons(extra){
  var out=[];
  orders.forEach(function(o){
    if(o.legacy)return;
    D.info[o.id].rows.forEach(function(r){
      if(!r.paid||(extra&&extra.orderId===o.id&&extra.personId===r.p.id))out.push({o:o,p:r.p});
    });
  });
  return out;
}
function lastEntry(){
  var best=null;
  orders.concat(payments).forEach(function(x){
    var t=Math.max(tsMs(x.updatedAt),tsMs(x.createdAt));
    if(t&&(!best||t>best.t))best={t:t,by:(x.updatedAt&&x.updatedBy)||x.by};
  });
  if(!best)return '';
  var d=new Date(best.t);
  return 'Zuletzt eingetragen: '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'. '+pad(d.getHours())+':'+pad(d.getMinutes())+' von '+who(best.by);
}

/* ---------- Rendering ---------- */
function pill(cls,t){return '<span class="pill '+cls+'">'+esc(t)+'</span>'}
function methodPill(m){return m==='paypal'?pill('pp','PayPal'):m==='sparkasse'?pill('sp','Sparkasse'):''}
function methodName(m){return m==='paypal'?'PayPal':m==='sparkasse'?'Sparkasse':''}
function catById(id){if(!id)return null;for(var i=0;i<cats.length;i++)if(cats[i].id===id)return cats[i];return null}
function catName(id){var c=catById(id);return c?c.name:''}
function sortedCats(){return cats.slice().sort(function(a,b){return a.name.localeCompare(b.name,'de')})}
function orderTitle(o){return o.title||catName(o.categoryId)||'Bestellung'}
function catPill(o){var n=catName(o.categoryId);return n&&o.title&&n.toLowerCase()!==o.title.toLowerCase()?'<span class="catp">'+esc(n)+'</span>':''}
function catOk(o,f){if(f==='all')return true;var c=catById(o.categoryId);return f==='none'?!c:!!c&&c.id===f}
function statusPill(o){
  var i=D.info[o.id];
  if(i.state==='none')return pill('grey','Personen fehlen');
  return i.state==='paid'?pill('ok','bezahlt'):pill('warn','offen');
}
function det(key,defOpen,cls,summary,body){
  var open=S.openMap[key]===undefined?defOpen:S.openMap[key];
  return '<details class="'+cls+'" data-k="'+esc(key)+'"'+(open?' open':'')+'><summary>'+summary+'</summary>'+body+'</details>';
}
function personHit(r,nq){
  if(!nq)return false;
  if(norm(r.p.name).indexOf(nq)>=0)return true;
  return r.pays.some(function(p){return norm((p.name||'')+' '+(p.note||'')).indexOf(nq)>=0});
}
function remindText(o,p){
  var first=String(p.name||'').trim().split(/\s+/)[0]||'';
  return 'Hallo '+first+', kurze Erinnerung zu deiner Bestellung „'+orderTitle(o)+'“ vom '+dShort(o.date)+': Offen sind noch '+money(p.shareCents||0).replace(/ /g,' ')+'. Danke dir! Liebe Grüße, Anna';
}
function orderCard(o,opt){
  opt=opt||{};
  var i=D.info[o.id],nq=opt.nq||'';
  var anyHit=!!nq&&i.rows.some(function(r){return personHit(r,nq)});
  var tot=toCollect(o),paidC=ordPaidSum(o),owe=i.state==='paid'?0:Math.max(tot-paidC,0);
  var sub=dLong(o.date)+(o.legacy?'':(i.n?' · <span class="nw">'+i.paid+' von '+i.n+(i.n===1?' Person':' Personen')+' bezahlt</span>':''));
  var pct=tot>0?Math.min(100,Math.round(paidC/tot*100)):(i.state==='paid'?100:0);
  var bar=o.legacy?'':'<span class="pbar"><span style="width:'+(i.state==='paid'?100:pct)+'%"></span></span>';
  var sum='<span class="main"><span class="tt"><span class="chev">›</span>'+esc(orderTitle(o))+'</span><span class="sub" style="display:block">'+sub+catPill(o)+'</span>'+bar+'</span>'+
    (o.legacy?'<span class="right"><span class="amt">'+money(tot)+'</span>'+pill('grey','Altdaten')+'</span>':'<span class="right kv"><span class="kl">Bestellwert</span><span class="amt">'+money(tot)+'</span><span class="kl">Bezahlt</span><span class="pv'+(i.state==='paid'?' done':'')+'">'+money(paidC)+(i.state==='paid'?' ✓':'')+'</span></span>');
  var shipSum=i.rows.reduce(function(a,r){return a+pShip(r.p)},0);
  var b='<div class="body"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0"><div class="mute" style="font-size:13.5px">'+(!o.legacy&&i.n?'Ware '+money(o.totalCents)+(shipSum>0?' · Versand '+money(shipSum):''):'')+(!o.legacy&&i.n&&gapCents(o)>0?'<div style="color:var(--warn);font-weight:600">Personen fehlen noch für '+money(gapCents(o))+'</div>':'')+(!o.legacy&&i.n&&gapCents(o)<0?'<div style="color:var(--warn);font-weight:600">Personen ergeben '+money(-gapCents(o))+' mehr als der Bestellwert</div>':'')+'</div><button class="btn small" data-act="edit-order" data-id="'+o.id+'">Bearbeiten</button></div>';
  if(o.legacy)b+='<div class="mute" style="padding:6px 0">Altdaten – zählt nur für Umsatz und Provision.</div>';
  else if(i.state==='none')b+='<div class="mute" style="padding:6px 0">Noch keine Personen eingetragen.</div>';
  var rowsV=i.rows.slice();
  if(i.n>=2){
    var pf=pfilter[o.id]||'all',np=i.paid,no=i.n-i.paid;
    b+='<div class="pfbar"><div class="seg sm">'+[['all','Alle'],['paid','Bezahlt'],['open','Offen']].map(function(x){return '<button type="button" class="plain'+(pf===x[0]?' on':'')+'" data-act="pf" data-o="'+o.id+'" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div><div class="cnt">'+np+' bezahlt · '+no+' offen</div></div>';
    if(pf==='paid')rowsV=rowsV.filter(function(r){return r.paid});
    if(pf==='open')rowsV=rowsV.filter(function(r){return !r.paid});
    rowsV.sort(function(a,c){return (pf==='all'&&a.paid!==c.paid)?(a.paid?1:-1):String(a.p.name||'').localeCompare(String(c.p.name||''),'de')});
  }
  rowsV.forEach(function(r){
    var share=r.p.shareCents||0,hl=personHit(r,nq)?' hl':'';
    if(r.paid){
      var pay=r.pays[0];
      b+='<div class="prow tap'+hl+'" data-act="edit-pay" data-id="'+pay.id+'"><div style="min-width:0"><div class="n">'+esc(r.p.name)+'</div><div class="d">'+money(share)+' · '+esc(methodName(pay.method))+' · '+dShort(pay.date)+'</div>'+(pShip(r.p)>0?'<div class="d">davon '+money(pShip(r.p))+' Versand</div>':'')+
        (r.sum!==share?'<div class="note">Betrag weicht ab: '+money(r.sum)+' statt '+money(share)+'</div>':'')+(pay.note?'<div class="pnote">'+esc(pay.note)+'</div>':'')+'</div>'+pill('ok','bezahlt')+'</div>';
    }else{
      var isq=quick&&quick.o===o.id&&quick.p===r.p.id;
      b+='<div class="prow'+hl+'" style="flex-wrap:wrap;gap:6px"><button class="chk'+(isq?' on':'')+'" data-act="quick" data-o="'+o.id+'" data-p="'+r.p.id+'" aria-label="Als bezahlt abhaken">✓</button><div style="min-width:0;flex:1"><div class="n">'+esc(r.p.name)+'</div><div class="d">'+money(share)+' · '+pill('warn','offen')+'</div>'+(pShip(r.p)>0?'<div class="d">davon '+money(pShip(r.p))+' Versand</div>':'')+'</div><div style="display:flex;gap:6px;justify-content:flex-end">'+
        '<button type="button" class="btn small ghost" data-act="remind" data-o="'+o.id+'" data-p="'+r.p.id+'">Erinnern</button>'+
        '<button class="btn small" data-act="pay-person" data-o="'+o.id+'" data-p="'+r.p.id+'" aria-label="Bezahlt mit Formular">…</button></div>'+
        (isq?'<div class="qrow"><button class="btn" data-act="quick-pay" data-m="paypal">PayPal</button><button class="btn" data-act="quick-pay" data-m="sparkasse">Sparkasse</button><button class="x" data-act="quick-x" aria-label="Abbrechen">×</button></div>':'')+'</div>';
    }
  });
  b+='</div>';
  return det((nq?'s-':'o-')+o.id,anyHit,'card',sum,b);
}
function renderHead(){
  var st=!loaded.orders||!loaded.payments||!loaded.categories?'Lädt …':(!S.online?'Offline – wird später übertragen':'');
  return '<div class="head"><div class="t" data-act="home"><div class="eyebrow">Demo · Sammelbestellungen</div><h1>Zahlungen</h1><div class="status" id="status">'+esc(st)+'</div></div><button class="gear" data-act="settings" aria-label="Einstellungen">⚙</button></div>'+
    '<div class="tabs" role="tablist">'+[['home','Übersicht'],['pay','Zahlungen'],['rev','Umsatz & Provision']].map(function(t){
      return '<button role="tab" class="'+(S.tab===t[0]?'on':'')+'" data-act="tab" data-t="'+t[0]+'">'+t[1]+'</button>'}).join('')+'</div>';
}
function unRow(p){
  return '<div class="prow"><div style="min-width:0"><div class="n">'+esc(p.name)+' · '+money(p.cents)+'</div><div class="d">'+dShort(p.date)+' · '+esc(methodName(p.method))+'</div>'+(p.note?'<div class="pnote">'+esc(p.note)+'</div>':'')+'</div><button class="btn small" data-act="edit-pay" data-id="'+p.id+'">Zuordnen</button></div>';
}
function orderQMatch(o,nq){
  var hay=norm((o.title||'')+' '+catName(o.categoryId)+' '+(o.people||[]).map(function(p){return p.name}).join(' '));
  if(hay.indexOf(nq)>=0)return true;
  return dateForms(o.date).some(function(x){return x.indexOf(nq)===0});
}
function searchResults(nq){
  var res=orders.filter(function(o){
    if(o.legacy){
      if(norm((o.title||'')+' '+catName(o.categoryId)).indexOf(nq)>=0)return true;
      return dateForms(o.date).some(function(x){return x.indexOf(nq)===0});
    }
    if(orderQMatch(o,nq))return true;
    return payments.some(function(p){return p.orderId===o.id&&norm((p.name||'')+' '+(p.note||'')).indexOf(nq)>=0});
  }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
  var un=unassigned().filter(function(p){return norm((p.name||'')+' '+(p.note||'')).indexOf(nq)>=0||dateForms(p.date).some(function(x){return x.indexOf(nq)===0})});
  var h='<div class="sec">Treffer · '+res.length+(res.length===1?' Bestellung':' Bestellungen')+'</div>';
  h+=res.length?res.map(function(o){return orderCard(o,{nq:nq})}).join(''):'<div class="card pad mute">Keine Bestellungen gefunden.</div>';
  if(un.length)h+='<div class="sec">Zahlungen ohne Bestellung</div><div class="card pad">'+un.map(unRow).join('')+'</div>';
  if(!res.length&&!un.length)h='<div class="card pad mute">Keine Treffer.</div>';
  return h;
}
function homeBody(){
  var m=S.month,h='';
  if(S.hq.trim().length>=2)return searchResults(norm(S.hq.trim()));
  if(cats.length){
    h+='<div class="chips">'+[['all','Alle']].concat(sortedCats().map(function(c){return [c.id,c.name]})).concat([['none','Ohne Kategorie']]).map(function(c){return '<button class="chip'+(S.catFilter===c[0]?' on':'')+'" data-act="catf" data-c="'+esc(c[0])+'">'+esc(c[1])+'</button>'}).join('')+'</div>';
  }
  var un=unassigned();
  if(un.length){
    h+=det('unassigned',false,'card warnbox','<span class="main"><span class="tt"><span class="chev">›</span>'+un.length+(un.length===1?' Zahlung ohne Bestellung':' Zahlungen ohne Bestellung')+'</span></span>','<div class="body">'+un.map(unRow).join('')+'</div>');
  }
  var cf=cats.length?S.catFilter:'all';
  var open=orders.filter(function(o){return !o.legacy&&catOk(o,cf)&&D.info[o.id].state!=='paid'}).sort(function(a,b){return a.date<b.date?1:-1});
  var paid=orders.filter(function(o){return !o.legacy&&catOk(o,cf)&&monthOf(o.date)===m&&D.info[o.id].state==='paid'}).sort(function(a,b){return a.date<b.date?1:-1});
  h+='<div class="sec">Offene Bestellungen</div>';
  h+=open.length?open.map(function(o){return orderCard(o)}).join(''):'<div class="card pad mute">Nichts offen.</div>';
  h+='<div class="sec">Bestellungen '+monthLabel(m)+'</div>';
  h+=paid.length?paid.map(function(o){return orderCard(o)}).join(''):'<div class="card pad mute">Keine bezahlten Bestellungen in diesem Monat.</div>';
  return h;
}
function renderHome(){
  var m=S.month,rev=monthRevenue(m),prov=commission(rev);
  var got=payments.reduce(function(a,p){return monthOf(p.date)===m?a+p.cents:a},0);
  var h='<div class="monthbar"><button class="arrow" data-act="mprev" aria-label="Vorheriger Monat">‹</button><div class="m">'+monthLabel(m)+'</div><button class="arrow" data-act="mnext" aria-label="Nächster Monat">›</button></div>';
  h+='<div class="sbox"><input class="search" id="hq" type="search" placeholder="Suchen: Name, Kategorie, Datum, Notiz …" value="'+esc(S.hq)+'" autocomplete="off"><button class="sx" data-act="hq-clear" aria-label="Suche leeren"'+(S.hq?'':' hidden')+'>✕</button></div>';
  h+='<div class="kpi"><div><div class="l">Umsatz</div><div class="v">'+money(rev)+'</div></div>'+
    '<div><div class="l">Provision ('+Math.round(rate(rev)*100)+' %)</div><div class="v">'+money(prov)+'</div></div>'+
    '<div><div class="l">Eingegangen</div><div class="v">'+money(got)+'</div></div>'+
    '<div><div class="l">Noch offen gesamt</div><div class="v">'+money(openTotal())+'</div></div></div>';
  h+='<div id="hbody">'+homeBody()+'</div>';
  return h;
}
function payRow(p){
  var o=p.orderId&&orders.filter(function(x){return x.id===p.orderId})[0];
  var ass=o?esc(orderTitle(o)):'<span style="color:var(--warn);font-weight:600">nicht zugeordnet</span>';
  return '<div class="prow tap" data-act="edit-pay" data-id="'+p.id+'"><div style="min-width:0"><div class="n">'+esc(p.name)+'</div><div class="d">'+dShort(p.date)+' · '+ass+'</div>'+(p.note?'<div class="pnote">'+esc(p.note)+'</div>':'')+'</div><div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px"><b style="white-space:nowrap">'+money(p.cents)+'</b>'+methodPill(p.method)+'</div></div>';
}
function payList(){
  var q=norm(S.q.trim());
  var list=payments.filter(function(p){
    if(S.filter==='paypal'&&p.method!=='paypal')return false;
    if(S.filter==='sparkasse'&&p.method!=='sparkasse')return false;
    if(S.filter==='un'&&p.orderId&&p.personId)return false;
    var o=p.orderId&&orders.filter(function(x){return x.id===p.orderId})[0];
    if(q&&norm((p.name||'')+' '+(p.note||'')+' '+(o?(o.title||'')+' '+catName(o.categoryId):'')).indexOf(q)<0)return false;
    if(S.payCat!=='all'){
      if(!o||!catOk(o,S.payCat))return false;
    }
    return true;
  }).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(tsMs(b.createdAt)-tsMs(a.createdAt))});
  if(!list.length)return '<div class="empty">Keine Zahlungen gefunden.</div>';
  var groups={},keys=[];
  list.forEach(function(p){var k=monthOf(p.date);if(!groups[k]){groups[k]=[];keys.push(k)}groups[k].push(p)});
  return keys.map(function(k){
    var tot=groups[k].reduce(function(a,p){return a+p.cents},0);
    var sum='<span class="main"><span class="tt"><span class="chev">›</span>'+monthLabel(k)+'</span><span class="sub" style="display:block">'+groups[k].length+(groups[k].length===1?' Zahlung':' Zahlungen')+'</span></span><span class="right"><span class="amt">'+money(tot)+'</span></span>';
    return det('pm-'+k,k===thisMonth,'card',sum,'<div class="body">'+groups[k].map(payRow).join('')+'</div>');
  }).join('');
}
function renderPay(){
  var m=thisMonth,tot=0,pp=0,sp=0;
  payments.forEach(function(p){if(monthOf(p.date)===m){tot+=p.cents;if(p.method==='paypal')pp+=p.cents;if(p.method==='sparkasse')sp+=p.cents}});
  var h='<div class="sums"><div><div class="l">'+monthName(m)+' gesamt</div><div class="v">'+money(tot)+'</div></div><div><div class="l">davon PayPal</div><div class="v">'+money(pp)+'</div></div><div><div class="l">davon Sparkasse</div><div class="v">'+money(sp)+'</div></div></div>';

function parseLine(l){
  l=l.replace(/^\s*(?:[-•*]|\d+[.)])\s*/,'').trim();

  var m=l.match(/^(.*?)[\s:–—-]*(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*€?\s*$/);
  if(m&&m[1].trim()){var c=parseCents(m[2]);if(c!=null)return {name:m[1].replace(/[\s:–—-]+$/,'').trim(),cents:c}}
  return {name:l.replace(/[\s:–—-]+$/,'').trim(),cents:null};
}

function normP(q){return {id:q.id,name:q.name,goodsCents:pGoods(q),shipCents:pShip(q),shareCents:q.shareCents||0}}
function wizSave(){
  readStep1();
  if(!F.people.length)return sheetErr('Bitte mindestens eine Person eintragen.');
  if(!F.date)return sheetErr('Bitte Datum eintragen.');
  var ship=shipC();
  var people=F.people.map(function(q){return {id:q.id,name:q.name,goodsCents:q.goods,shipCents:ship,shareCents:q.goods+ship}});
  var total=F.people.reduce(function(a,q){return a+q.goods},0);
  if(F.orig){var bwEl=$('#w-bw'),bw=bwEl?parseCents(bwEl.value):(F.bw!=null?F.bw:F.orig.totalCents);if(bw==null)return sheetErr('Bitte Bestellwert prüfen.');total=bw}
  var cid=F.catId||null,o=F.orig,col=db.collection('orders'),pr;
  if(!o){
    pr=col.doc().set({date:F.date,title:F.title,categoryId:cid,totalCents:total,shipPerPersonCents:ship,people:people,legacy:false,createdAt:ts(),updatedAt:ts(),by:by()});
    clearDraft();
  }else{
    var ch={};
    if(o.date!==F.date)ch.date=F.date;
    if((o.title||'')!==F.title)ch.title=F.title;
    if((o.categoryId||null)!==cid)ch.categoryId=cid;
    if(o.totalCents!==total)ch.totalCents=total;
    if((o.shipPerPersonCents||0)!==ship)ch.shipPerPersonCents=ship;
    if(JSON.stringify((o.people||[]).map(normP))!==JSON.stringify(people))ch.people=people;
    if(!Object.keys(ch).length){closeSheet();return}
    ch.updatedAt=ts();ch.updatedBy=by();
    var batch=db.batch();
    batch.update(col.doc(o.id),ch);
    if(ch.people){
      var keep={};people.forEach(function(q){keep[q.id]=1});
      payments.forEach(function(x){if(x.orderId===o.id&&x.personId&&!keep[x.personId])batch.update(db.collection('payments').doc(x.id),{orderId:null,personId:null})});
    }
    pr=batch.commit();
  }
  closeSheet();
  pr.catch(function(){fail()});
}
function deleteOrder(){
  var btn=$('#f-del');
  if(!F.confirmDel){F.confirmDel=true;btn.textContent='Wirklich löschen? Nochmal tippen';return}
  var o=F.orig,batch=db.batch();
  var odata=snapDoc(o),oid=o.id;
  var aff=payments.filter(function(p){return p.orderId===oid}).map(function(p){return {id:p.id,orderId:p.orderId,personId:p.personId}});
  aff.forEach(function(a){batch.update(db.collection('payments').doc(a.id),{orderId:null,personId:null})});
  batch.delete(db.collection('orders').doc(oid));
  closeSheet();
  batch.commit().then(function(){
    showUndo('Bestellung gelöscht',function(){
      var b=db.batch();
      b.set(db.collection('orders').doc(oid),odata);
      aff.forEach(function(a){b.update(db.collection('payments').doc(a.id),{orderId:a.orderId,personId:a.personId})});
      b.commit().catch(function(){fail('Konnte nicht wiederhergestellt werden')});
    });
  }).catch(function(){fail('Konnte nicht gelöscht werden')});
}

/* Zahlung */
function score(c,name,cents){
  var n=norm((name||'').trim()),pn=norm(c.p.name||''),s=0;
  if(n&&(pn.indexOf(n)>=0||n.indexOf(pn)>=0))s+=2;
  if(cents!=null&&cents===c.p.shareCents)s+=1;
  return s;
}
function nameSuggest(v){
  var nq=norm(String(v||'').trim());
  if(!nq)return [];
  var map={};
  function add(n){n=String(n||'').trim();if(!n)return;var k=norm(n);var e=map[k]||(map[k]={v:{}});e.v[n]=(e.v[n]||0)+1}
  payments.forEach(function(p){add(p.name)});
  orders.forEach(function(o){(o.people||[]).forEach(function(p){add(p.name)})});
  var out=[];
  Object.keys(map).forEach(function(k){
    if(k===nq||k.indexOf(nq)<0)return;
    var best=null,bc=0;Object.keys(map[k].v).forEach(function(n){if(map[k].v[n]>bc){bc=map[k].v[n];best=n}});
    out.push(best);
  });
  out.sort(function(a,b){return a.localeCompare(b,'de')});
  return out.slice(0,6);
}

function renderSugs(){
  var name=$('#f-name').value,cents=parseCents($('#f-amt').value),q=norm((F.asq||'').trim()),hasName=!!name.trim();
  var sel=F.sel;
  var sc='';
  if(sel){
    var fp=findPerson(sel.orderId,sel.personId);
    if(fp){
      if(sel.isNew)sc='<div class="selcard"><div class="t"><b>Neu bei '+esc(orderTitle(fp.o))+':</b> '+esc(name.trim()||'…')+'</div><button type="button" class="btn small" data-act="f-unsel">Ändern</button></div>';
      else if(fp.p)sc='<div class="selcard"><div class="t"><b>Zugeordnet:</b> '+esc(fp.p.name)+' · '+esc(orderTitle(fp.o))+' '+dShort(fp.o.date)+' · '+money(fp.p.shareCents||0)+'</div><button type="button" class="btn small" data-act="f-unsel">Ändern</button></div>';
    }
  }
  $('#f-selcard').innerHTML=sc;
  document.querySelectorAll('#f-view button').forEach(function(b){b.classList.toggle('on',b.dataset.v===F.view)});
  var all=orders.filter(function(o){return !o.legacy&&(D.info[o.id].state!=='paid'||(sel&&sel.orderId===o.id))});
  var items=[];
  all.forEach(function(o){
    if(q&&!orderQMatch(o,q))return;
    var rows=D.info[o.id].rows.filter(function(r){return !r.paid||(sel&&!sel.isNew&&sel.orderId===o.id&&sel.personId===r.p.id)});
    var best=0,qp=false;
    rows.forEach(function(r){r.s=score({p:r.p},name,cents);if(r.s>best)best=r.s;if(q&&norm(r.p.name).indexOf(q)>=0)qp=true});
    rows.sort(function(x,y){return y.s-x.s||String(x.p.name||'').localeCompare(String(y.p.name||''),'de')});
    items.push({o:o,rows:rows,best:best,qp:qp,hasSel:!!(sel&&sel.orderId===o.id)});
  });
  var groups={},keys=[];
  items.forEach(function(x){
    var k=F.view==='cat'?(catById(x.o.categoryId)?x.o.categoryId:'none'):x.o.date;
    if(!groups[k]){groups[k]={items:[]};keys.push(k)}
    groups[k].items.push(x);
  });
  if(F.view==='cat')keys.sort(function(a,b){if(a==='none')return 1;if(b==='none')return -1;return catName(a).localeCompare(catName(b),'de')});
  else keys.sort(function(a,b){return a<b?1:-1});
  var h='<button type="button" class="sug'+(!sel?' on':'')+'" data-act="f-sel" data-o="" data-p=""><span class="a"><b>Ohne Zuordnung</b></span></button>';
  keys.forEach(function(k){
    var g=groups[k];
    g.items.sort(function(a,b){return b.best-a.best||(a.o.date<b.o.date?1:a.o.date>b.o.date?-1:0)||orderTitle(a.o).localeCompare(orderTitle(b.o),'de')});
    var auto=!!q||g.items.some(function(x){return x.best>0||x.hasSel});
    var gk=F.view+':'+k;
    var open=F.gopen[gk]===undefined?auto:F.gopen[gk];
    var label=F.view==='cat'?(k==='none'?'Ohne Kategorie':catName(k)):dLong(k);
    var body=g.items.map(function(x){
      var o=x.o,expAuto=x.best>0||x.qp||x.hasSel;
      var exp=F.oexp[o.id]===undefined?expAuto:F.oexp[o.id];
      var cn=catName(o.categoryId);
      var sub=(F.view==='cat'?'':(cn&&o.title&&norm(cn)!==norm(o.title)?cn+' · ':''))+dShort(o.date)+' · '+orderProgress(o);
      var r='<div class="ord"><button type="button" class="ordh" data-act="f-ord" data-o="'+o.id+'" data-exp="'+(exp?1:0)+'" aria-expanded="'+(exp?'true':'false')+'"><span class="a"><b><span class="chev" style="'+(exp?'transform:rotate(90deg)':'')+'">›</span>'+esc(orderTitle(o))+'</b><span>'+esc(sub)+'</span></span><span class="r">'+money(toCollect(o))+'</span></button>';
      if(exp){
        r+='<div class="ordb">'+x.rows.map(function(rw){return sugPerson(o,rw.p,sel&&!sel.isNew&&sel.orderId===o.id&&sel.personId===rw.p.id,rw.s>0)}).join('');
        var isn=sel&&sel.isNew&&sel.orderId===o.id;
        r+='<button type="button" class="btn newp'+(isn?' on':'')+'" data-act="f-newp" data-o="'+o.id+'"'+(hasName?'':' disabled')+'>+ Als neue Person hinzufügen'+(hasName?': '+esc(name.trim()):'')+'</button>'+(hasName?'':'<div class="mute" style="font-size:12.5px;margin:4px 2px 0">Erst Name eintragen</div>');
        r+='</div>';
      }
      return r+'</div>';
    }).join('');
    h+='<details class="grp" data-g="'+esc(gk)+'" data-auto="'+(auto?1:0)+'"'+(open?' open':'')+'><summary><span><span class="chev">›</span>'+esc(label)+' · '+g.items.length+' offen</span></summary><div class="gb">'+body+'</div></details>';
  });
  if(!keys.length)h+='<div class="mute" style="font-size:13px;padding:4px 2px">'+(all.length?'Keine Treffer.':'Keine offenen Bestellungen')+'</div>';
  $('#f-sugs').innerHTML=h;
}

}

function savePay(){
  var date=$('#f-date').value,name=$('#f-name').value.trim(),cents=parseCents($('#f-amt').value);
  if(!date)return sheetErr('Bitte Datum eintragen.');
  if(!name)return sheetErr('Bitte Namen eintragen.');
  if(cents==null||cents<=0)return sheetErr('Bitte einen gültigen Betrag eintragen.');
  if(!F.method)return sheetErr('Bitte PayPal oder Sparkasse wählen.');
  var note=$('#f-note').value.trim().slice(0,200);
  var sel=F.sel,oid=sel?sel.orderId:null,pid=sel?(sel.isNew?sel.newId:sel.personId):null,p=F.orig,pr;
  var col=db.collection('payments'),batch=db.batch(),ref;
  if(sel&&sel.isNew){
    var oo=findPerson(oid,null).o,spp=oo.shipPerPersonCents||0,gd=Math.max(cents-spp,0);
    var np={id:pid,name:name,goodsCents:gd,shipCents:cents-gd,shareCents:cents};
    batch.update(db.collection('orders').doc(oid),{people:FV.arrayUnion(np),updatedAt:ts(),updatedBy:by()});
  }
  if(!p){
    var nd={date:date,name:name,cents:cents,method:F.method,orderId:oid,personId:pid,createdAt:ts(),by:by()};
    if(note)nd.note=note;
    batch.set(col.doc(),nd);
  }else{
    var ch={};
    if(p.date!==date)ch.date=date;
    if(p.name!==name)ch.name=name;
    if(p.cents!==cents)ch.cents=cents;
    if(p.method!==F.method)ch.method=F.method;
    if((p.note||'')!==note)ch.note=note;
    if((p.orderId||null)!==oid)ch.orderId=oid;
    if((p.personId||null)!==pid)ch.personId=pid;
    if(!Object.keys(ch).length){closeSheet();return}
    ch.updatedAt=ts();ch.updatedBy=by();
    batch.update(col.doc(p.id),ch);
  }
  pr=batch.commit();
  closeSheet();
  pr.catch(function(){fail()});
}

  function resolve(v,cur,k){
    if(v&&v.__ts)return Date.now();
    if(v&&v.__union)return (cur&&cur[k]||[]).concat([clone(v.__union)]);
    return clone(v);
  }
  function find(c,id){var a=store[c];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
  function applySet(c,id,data){var o={id:id};for(var k in data)o[k]=resolve(data[k],null,k);var a=store[c],i;for(i=0;i<a.length;i++)if(a[i].id===id){a[i]=o;return}a.push(o)}
  function applyUpdate(c,id,ch){var o=find(c,id);if(!o)return;for(var k in ch)o[k]=resolve(ch[k],o,k)}
  function applyDelete(c,id){store[c]=store[c].filter(function(x){return x.id!==id})}
  function notify(){
    if(queued)return;queued=true;
    Promise.resolve().then(function(){queued=false;listeners.slice().forEach(function(l){l.fire()})});
  }
  function ref(c,id){return {id:id,coll:c,
