<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tagesstart</title>
<style>
:root{
  --bg:#18201c; --panel:#202a25; --card:#273330; --line:#34443d;
  --text:#e3e8e2; --muted:#a2b0a6;
  --green:#8db596; --green-d:#5f8a6b; --mauve:#b898b0; --mauve-d:#7f6379;
  --privat:#b898b0; --firma:#8db596; --projekt:#c9b27c;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.demo{background:#131a16;border-bottom:1px solid var(--line);text-align:center;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 16px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 30px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:6px}
nav h1{font-size:22px;font-weight:600;color:var(--green)}
nav .date{font-size:14px;color:var(--muted);margin-bottom:18px}
nav .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 2px}
.f{background:none;border:1px solid transparent;border-radius:8px;text-align:left;padding:8px 10px;display:flex;align-items:center;gap:8px;color:var(--text)}
.f:hover{background:var(--card)}
.f[aria-pressed=true]{background:var(--card);border-color:var(--mauve-d)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.d-privat{background:var(--privat)}.d-firma{background:var(--firma)}.d-projekt{background:var(--projekt)}
main{padding:24px;max-width:860px;width:100%}
h2{font-size:20px;font-weight:600;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}
.sub{color:var(--muted);font-size:14px}
.habits{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.habit,.task{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--mauve-d);flex:none;display:grid;place-items:center;color:transparent;font-size:15px;line-height:1;transition:.2s}
[aria-checked=true] .box{background:var(--green);border-color:var(--green);color:#16201a}
[aria-checked=true] .t{text-decoration:line-through;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--panel);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mauve),var(--green));transition:width .4s}
.gatewrap{position:relative}
.day{display:grid;gap:0}
.gate{position:absolute;inset:0;z-index:5;display:flex;border-radius:14px;overflow:hidden;pointer-events:auto}
.gate .l,.gate .r{flex:1;background:var(--panel);border:1px solid var(--line);transition:transform 1s cubic-bezier(.7,0,.3,1)}
.gate .l{border-right:1px solid var(--mauve-d)}.gate .r{border-left:1px solid var(--mauve-d)}
.gate .msg{position:absolute;inset:0;display:grid;place-items:start center;padding-top:60px;text-align:center;color:var(--muted);padding-inline:24px;transition:opacity .4s}
.open .gate .l{transform:translateX(-101%)}.open .gate .r{transform:translateX(101%)}
.open .gate .msg{opacity:0}
.open .gate{pointer-events:none}
.gatewrap:not(.open) .day{filter:blur(3px);opacity:.5;max-height:420px;overflow:hidden}
.gatewrap.done .gate{display:none}
.row{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:baseline}
.row:first-of-type{border-top:0}
.time{width:52px;flex:none;color:var(--green);font-variant-numeric:tabular-nums}
.tag{font-size:12px;border:1px solid currentColor;border-radius:99px;padding:0 8px;flex:none;line-height:20px}
.c-privat{color:var(--privat)}.c-firma{color:var(--firma)}.c-projekt{color:var(--projekt)}
.mail{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.mail:first-of-type{border-top:0}
.mail .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mail b{font-weight:600}
.mail .s{overflow-wrap:anywhere}
.task{margin-bottom:8px}
.empty{color:var(--muted)}
button:focus-visible{outline:2px solid var(--mauve);outline-offset:2px}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav{border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;flex-direction:row;flex-wrap:wrap;align-items:center}
  nav h1{margin-right:auto}
  nav .date{width:100%;order:2;margin:0 0 4px}
  nav .lbl{display:none}
  nav .fs{order:3;display:flex;flex-wrap:wrap;gap:6px}
  main{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="demo">Demo mit Beispieldaten</div>
<div class="app">
  <nav aria-label="Navigation">
    <h1>Tagesstart</h1>
    <div class="date">Sonntag, 25.10.2026</div>
    <div class="lbl">Postfach</div>
    <div class="fs" id="filters"></div>
  </nav>
  <main>
    <section class="card" aria-labelledby="hg">
      <h2 id="hg">Gewohnheits-Tor</h2>
      <p class="sub" id="gsub">Erst die Morgen-Routine, dann öffnet sich der Tag.</p>
      <ul class="habits" id="habits"></ul>
      <div class="bar"><i id="prog"></i></div>
    </section>
    <div class="gatewrap" id="gw">
      <div class="gate" aria-hidden="true"><div class="l"></div><div class="r"></div><div class="msg">Das Tor öffnet sich, sobald alle drei Punkte erledigt sind.</div></div>
      <div class="day" id="day">
        <section class="card" aria-labelledby="ht"><h2 id="ht">Termine heute</h2><div id="events"></div></section>
        <section class="card" aria-labelledby="hm"><h2 id="hm">Wichtige Mails</h2><div id="mails"></div></section>
        <section class="card" aria-labelledby="hk"><h2 id="hk">Offene Aufgaben</h2><div class="sub" id="tcount" style="margin-bottom:10px"></div><div id="tasks"></div></section>
      </div>
    </div>
  </main>
</div>
<script>
(function(){
var KEY='tagesstart-demo';
var habits=[{id:'h1',t:'Supplemente nehmen',d:false},{id:'h2',t:'Zähne putzen',d:false},{id:'h3',t:'Duschen',d:false}];
var events=[
 {t:'09:30',n:'Zahnarzt',w:'Praxis Lindenhof'},
 {t:'11:00',n:'Wochenplanung',w:'Zuhause'},
 {t:'14:00',n:'Telefonat Kundin Frau Beispiel',w:'Telefon'},
 {t:'16:30',n:'Spaziergang mit den Kindern',w:'Stadtpark'},
 {t:'19:00',n:'Abendessen bei Familie Muster',w:'Beispielstadt'}];
var mails=[
 {a:'privat',f:'Anna Muster',s:'Geburtstagsfeier am Samstag – wer bringt was?',z:'07:42'},
 {a:'firma',f:'Team Vertrieb',s:'Wochenübersicht KW 44 liegt bereit',z:'07:15'},
 {a:'projekt',f:'Max Beispiel',s:'Entwurf Startseite: Rückmeldung bis Dienstag',z:'Gestern'},
 {a:'firma',f:'Buchhaltung Demo GmbH',s:'Rechnung 2026-1048 zur Freigabe',z:'Gestern'},
 {a:'privat',f:'Stadtwerke Beispielstadt',s:'Ihre Jahresabrechnung ist online',z:'Fr'},
 {a:'projekt',f:'Lena Probe',s:'Neue Anfrage: Dashboard für kleines Team',z:'Fr'}];
var tasks=[
 {id:'t1',t:'Angebot für Kundin Beispiel fertigstellen',d:false},
 {id:'t2',t:'Rückruf Handwerker wegen Terminverschiebung',d:false},
 {id:'t3',t:'Rechnung 2026-1048 prüfen',d:false},
 {id:'t4',t:'Geschenk für Samstag besorgen',d:false},
 {id:'t5',t:'Entwurf Startseite kommentieren',d:false}];
var acc={alle:'Alle',privat:'Privat',firma:'Firma',projekt:'Projekt'};
var filter='alle';
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function save(){}
function load(){}
function rHabits(){
 $('habits').innerHTML=habits.map(function(h){return '<li><button class="habit" role="checkbox" aria-checked="'+h.d+'" data-h="'+h.id+'"><span class="box">&#10003;</span><span class="t">'+esc(h.t)+'</span></button></li>'}).join('');
 var n=habits.filter(function(h){return h.d}).length;
 $('prog').style.width=(n/habits.length*100)+'%';
 $('gsub').textContent=n===habits.length?'Geschafft. Das Tor ist offen – guten Start in den Tag.':n+' von '+habits.length+' erledigt.';
}
function rFilters(){
 $('filters').innerHTML=Object.keys(acc).map(function(k){var c=mails.filter(function(m){return k==='alle'||m.a===k}).length;return '<button class="f" aria-pressed="'+(filter===k)+'" data-f="'+k+'"><span class="dot d-'+k+'"></span>'+acc[k]+' <span class="sub" style="margin-left:auto;font-size:12px">'+c+'</span></button>'}).join('');
}
function rMails(){
 var l=mails.filter(function(m){return filter==='alle'||m.a===filter});
 $('mails').innerHTML=l.length?l.map(function(m){return '<div class="mail"><div class="h"><span class="tag c-'+m.a+'">'+acc[m.a]+'</span><b>'+esc(m.f)+'</b><span class="sub" style="margin-left:auto">'+m.z+'</span></div><div class="s">'+esc(m.s)+'</div></div>'}).join(''):'<p class="empty">Keine Mails.</p>';
}
function rTasks(){
 $('tasks').innerHTML=tasks.map(function(t){return '<button class="task" role="checkbox" aria-checked="'+t.d+'" data-t="'+t.id+'"><span class="box">&#10003;</span><span class="t">'+esc(t.t)+'</span></button>'}).join('');
 var o=tasks.filter(function(t){return !t.d}).length;
 $('tcount').textContent=o?o+' offen':'Alles erledigt.';
}
function gate(first){
 var all=habits.every(function(h){return h.d});
 var g=$('gw');
 if(all){ if(!g.classList.contains('open')){g.classList.add('open');setTimeout(function(){g.classList.add('done')},first?0:1100);} }
 else{g.classList.remove('open','done')}
 $('day').toggleAttribute('inert',!all);
}
$('events').innerHTML=events.map(function(e){return '<div class="row"><span class="time">'+e.t+'</span><div><div>'+esc(e.n)+'</div><div class="sub">'+esc(e.w)+'</div></div></div>'}).join('');
document.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.h){habits.forEach(function(h){if(h.id===b.dataset.h)h.d=!h.d});rHabits();gate();save();}
 else if(b.dataset.t){tasks.forEach(function(t){if(t.id===b.dataset.t)t.d=!t.d});rTasks();save();}
 else if(b.dataset.f){filter=b.dataset.f;rFilters();rMails();}
});
load();rHabits();rFilters();rMails();rTasks();gate(true);
})();
</script>
</body>
</html>
